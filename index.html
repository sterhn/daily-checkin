<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151310">
<title>daily check-in</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0e0c0a;
    --card: #17140f;
    --card-edge: #2a251d;
    --field: #1d1913;
    --text: #efe8db;
    --muted: #a39b8b;
    --faint: #6b6452;
    --sleep: #8589c4;
    --sleep-dim: #4c4e74;
    --mood: #d1ac62;
    --mood-dim: #6d5a34;
    --body: #93ab8b;
    --body-dim: #4d5c49;
    --slipped: #d0917f;
    --flame: #e0915a;
    --flame-dim: #5e3b24;
    --cream: #efe8db;
    --seg-off: #241f18;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15.5px;
    line-height: 1.45;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  button { font: inherit; }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 12px 92px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    padding: 24px 20px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 1.6rem;
    letter-spacing: 0.01em;
  }
  .sub {
    color: var(--muted);
    letter-spacing: 0.08em;
    font-size: 0.85rem;
    margin-top: 3px;
  }
  .label {
    color: var(--muted);
    letter-spacing: 0.08em;
    font-size: 0.85rem;
    text-transform: lowercase;
  }
  .section { margin-top: 26px; }
  .scale-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .scale-val {
    font-family: Georgia, serif;
    font-size: 1.35rem;
    min-width: 1.2em;
    text-align: right;
  }
  .scale-val.empty { color: var(--faint); }

  .segments { display: flex; gap: 5px; touch-action: pan-y; cursor: pointer; }
  .segments button {
    flex: 1;
    height: 46px;
    border: none;
    border-radius: 6px;
    background: var(--seg-off);
    pointer-events: none; /* slide is handled on the row */
    transition: background 0.16s ease, transform 0.2s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .segments button.tip { transform: scaleY(1.15); }
  .segments:focus-visible {
    outline: 2px solid var(--accent, var(--cream));
    outline-offset: 3px;
    border-radius: 8px;
  }

  .face-row { display: flex; gap: 5px; margin-top: 9px; align-items: center; }
  .face-row button {
    flex: 1;
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
    line-height: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .face-row button.on { transform: scale(1.22); }
  .face-row svg { width: 100%; max-width: 26px; height: auto; }
  .face-row .face-stroke { stroke: var(--faint); transition: stroke 0.2s; }
  .face-row .face-fill { fill: var(--faint); transition: fill 0.2s; }
  .face-row button.on .face-stroke { stroke: var(--mood); }
  .face-row button.on .face-fill { fill: var(--mood); }
  .face-row button.on svg { filter: drop-shadow(0 0 5px rgba(201,164,92,0.45)); }
  .mood-word {
    margin-top: 7px;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--mood);
    letter-spacing: 0.08em;
    min-height: 1.2em;
    text-align: right;
  }
  .mood-word.wisp { animation: wisp 0.35s ease; }
  @keyframes wisp {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .scale-val.bump { animation: bump 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bump {
    0% { transform: scale(1.45); }
    100% { transform: scale(1); }
  }

  textarea, .field {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    color: var(--text);
    font: inherit;
    padding: 12px;
  }
  textarea {
    min-height: 68px;
    resize: vertical;
    margin-top: 10px;
  }
  textarea::placeholder, .field::placeholder { color: var(--faint); }
  textarea:focus, .field:focus { outline: 1px solid var(--muted); }
  .field[type="date"] { color-scheme: dark; }

  .btn-primary {
    width: 100%;
    margin-top: 26px;
    background: var(--cream);
    color: #17140f;
    border: none;
    border-radius: 999px;
    padding: 13px;
    font-family: Georgia, serif;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .btn-primary { transition: transform 0.12s ease, opacity 0.12s ease; }
  .btn-primary:active { opacity: 0.88; transform: scale(0.975); }
  .btn-primary.pulse { animation: pulse 0.45s ease; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(236, 229, 216, 0.45); }
    100% { box-shadow: 0 0 0 14px rgba(236, 229, 216, 0); }
  }
  .btn-ghost {
    width: 100%;
    margin-top: 10px;
    background: none;
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    color: var(--muted);
    padding: 12px;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
  }

  .summary {
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 13px 15px;
    margin-top: 20px;
  }
  .summary .label { font-size: 0.78rem; }
  .summary-vals { display: flex; gap: 18px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .summary-vals span { color: var(--muted); letter-spacing: 0.05em; font-size: 0.9rem; }
  .summary-vals b {
    font-family: Georgia, serif;
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--text);
    margin-left: 3px;
  }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 13px 0;
    border-bottom: 1px solid var(--card-edge);
  }
  .row:last-child { border-bottom: none; }
  .row .name { flex: 1; font-size: 0.95rem; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pills button {
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    color: var(--muted);
    padding: 7px 12px;
    min-height: 44px;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.12s;
  }
  .pills button:active { transform: scale(0.94); }
  .pills button.held-on { border-color: var(--body); color: var(--body); background: #1a2018; }
  .pills button.slipped-on { border-color: var(--slipped); color: var(--slipped); background: #241713; }
  .pills button.neutral-on { border-color: var(--muted); color: var(--text); }
  .pills button.flame-on { border-color: var(--flame); color: var(--flame); background: #261a11; }
  .row .remove, .remove {
    background: none; border: none; color: var(--muted);
    font-size: 0.95rem; cursor: pointer;
    min-width: 44px; min-height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .add-boundary { display: flex; gap: 6px; margin-top: 12px; }
  .add-boundary input {
    flex: 1;
    min-width: 0;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 9px 11px;
  }
  .add-boundary input::placeholder { color: var(--faint); }
  .add-boundary button, .add-boundary select {
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 8px;
    color: var(--muted);
    padding: 0 14px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .add-boundary select { font-size: 0.85rem; padding: 0 8px; color-scheme: dark; }
  .edit-link {
    background: none; border: none; color: var(--muted);
    font-size: 0.8rem; letter-spacing: 0.1em; cursor: pointer; padding: 6px 0;
  }

  .head-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 3px;
  }
  .head-row .sub { margin-top: 0; }
  .day-toggle button { padding: 6px 11px; font-size: 0.8rem; letter-spacing: 0.04em; }
  .day-toggle .mark, .nav-dot {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--body);
    margin-left: 5px;
    vertical-align: 2px;
  }
  .saved-note {
    color: var(--faint);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    transition: color 0.3s;
  }
  .saved-note.fresh { color: var(--body); }

  /* streak strip */
  .strip {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 16px;
    padding: 14px 16px 12px;
    margin-bottom: 10px;
  }
  .streak-row { display: flex; align-items: center; gap: 10px; }
  .flame { width: 30px; height: 30px; color: var(--faint); line-height: 0; flex: none; }
  .flame svg { width: 100%; height: 100%; }
  .flame.lit { color: var(--flame); filter: drop-shadow(0 0 6px rgba(224,145,90,0.45)); }
  .flame.lit.pop { animation: flamePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes flamePop {
    0% { transform: scale(0.6); }
    60% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .streak-num { font-family: Georgia, serif; font-size: 1.9rem; line-height: 1; }
  .streak-txt { flex: 1; font-size: 0.9rem; line-height: 1.25; }
  .streak-txt small { display: block; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.03em; }
  .best { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.05em; text-align: right; }
  .best b { font-family: Georgia, serif; font-weight: 400; font-size: 1.05rem; color: var(--text); display: block; }

  .week { display: flex; justify-content: space-between; margin-top: 13px; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .wd span { font-size: 0.7rem; color: var(--faint); letter-spacing: 0.05em; }
  .wd.today span { color: var(--text); }
  .pip {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--card-edge);
    display: flex; overflow: hidden;
  }
  .pip i { flex: 1; }
  .pip i.on { background: var(--flame); }
  .wd.today .pip { border-color: var(--muted); }
  .wd.future .pip { opacity: 0.4; }
  .week-legend { color: var(--faint); font-size: 0.7rem; text-align: center; margin-top: 7px; letter-spacing: 0.04em; }

  .chips { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    color: var(--muted);
    padding: 6px 11px 6px 8px;
    min-height: 36px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .chip svg { width: 16px; height: 16px; }
  .chip.done { border-color: var(--flame-dim); color: var(--flame); }

  /* goals */
  .goal {
    position: relative;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    padding: 15px 14px;
    margin-top: 14px;
    transition: border-color 0.3s;
  }
  .goal.done { border-color: var(--flame-dim); }
  .goal-top { display: flex; align-items: center; gap: 12px; }
  .goal-icon {
    width: 38px; height: 38px; flex: none;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--card-edge);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .goal.done .goal-icon { color: var(--flame); border-color: var(--flame-dim); }
  .goal-icon svg { width: 20px; height: 20px; }
  .goal-main { flex: 1; min-width: 0; }
  .goal-title { font-size: 1rem; }
  .goal-meta { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.03em; }
  .goal-count { font-family: Georgia, serif; font-size: 1.4rem; }
  .goal-count span { color: var(--faint); font-size: 1rem; }
  .goal.done .goal-count { color: var(--flame); }
  .goal-bar { display: flex; gap: 4px; margin-top: 12px; }
  .goal-bar i { flex: 1; height: 5px; border-radius: 3px; background: var(--seg-off); transition: background 0.3s; }
  .goal-bar i.on { background: var(--flame); }
  .goal-streak { color: var(--flame); font-size: 0.8rem; margin-top: 9px; letter-spacing: 0.03em; display: flex; align-items: center; gap: 5px; }
  .goal-streak svg { width: 14px; height: 14px; }
  .goal-streak.cold { color: var(--faint); }
  .entries { list-style: none; margin-top: 10px; }
  .entries li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-top: 1px solid var(--card-edge);
    font-size: 0.92rem;
  }
  .entries .e-date { color: var(--faint); font-size: 0.78rem; min-width: 52px; }
  .entries .e-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entries .remove { min-width: 36px; min-height: 36px; font-size: 0.85rem; }
  .tag {
    font-size: 0.7rem; letter-spacing: 0.05em;
    color: var(--muted);
    border: 1px solid var(--card-edge);
    border-radius: 999px;
    padding: 1px 7px;
  }
  .goal-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .goal-actions .btn-ghost { margin-top: 0; flex: 1; color: var(--text); }
  .goal-actions .edit-link { padding: 10px 4px; }
  .log-form { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
  .log-form .row-btns { display: flex; gap: 8px; }
  .log-form .btn-primary { margin-top: 0; flex: 1; padding: 11px; font-size: 1rem; }
  .log-form .btn-ghost { margin-top: 0; width: auto; padding: 11px 16px; }
  .current-read { margin-top: 12px; }
  .current-read .label { font-size: 0.75rem; }
  .current-read .field { margin-top: 6px; padding: 9px 11px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .suggest button { padding-left: 11px; }
  .collection { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .collection div {
    flex: 1; min-width: 90px;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 11px 12px;
  }
  .collection b { display: block; font-family: Georgia, serif; font-weight: 400; font-size: 1.4rem; }
  .collection span { color: var(--muted); font-size: 0.8rem; }

  .spark {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--flame);
    pointer-events: none;
    animation: spark 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .spark:nth-child(3n) { background: var(--mood); }
  .spark:nth-child(3n+1) { background: var(--cream); width: 4px; height: 4px; }
  @keyframes spark {
    from { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
  }

  /* trends */
  .trends-head { display: flex; justify-content: space-between; align-items: center; }
  .range-toggle {
    display: flex;
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 9px;
    overflow: hidden;
  }
  .range-toggle button {
    background: none; border: none; color: var(--muted);
    padding: 7px 12px; font-size: 0.85rem; cursor: pointer;
  }
  .range-toggle button.on { background: #262117; color: var(--text); }
  .avgs { display: flex; gap: 18px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  .avgs span { color: var(--muted); letter-spacing: 0.05em; font-size: 0.9rem; }
  .avgs b { font-family: Georgia, serif; font-weight: 400; font-size: 1.2rem; color: var(--text); margin-left: 5px; }
  .chart-box {
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 10px;
    margin-top: 18px;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .bar-row .name { flex: 1; font-size: 0.9rem; }
  .bar-track { flex: 1.2; height: 4px; background: var(--seg-off); border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--body); border-radius: 2px; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
  .bar-row .pct { width: 46px; text-align: right; font-size: 0.9rem; }
  .mini-card {
    background: var(--field);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    padding: 15px 14px;
    margin-top: 22px;
  }
  .mini-card .avgs { margin-top: 10px; }
  .mini-card .bar-row { padding: 7px 0; }
  .mini-card .bar-fill.gold-hi { background: var(--mood); }
  .mini-card .bar-fill.gold-lo { background: var(--mood-dim); }
  .mood-face-inline { display: inline-block; vertical-align: -3px; margin-left: 6px; line-height: 0; }
  .mood-face-inline svg { width: 15px; height: 15px; }
  .mood-face-inline .face-stroke { stroke: var(--mood); }
  .mood-face-inline .face-fill { fill: var(--mood); }

  .empty-note { color: var(--faint); margin-top: 16px; letter-spacing: 0.03em; font-size: 0.9rem; }

  /* tabs */
  nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(14,12,10,0.94);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-edge);
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1;
    max-width: 112px;
    background: none; border: none;
    color: var(--muted);
    font-size: 0.88rem;
    letter-spacing: 0.06em;
    padding: 11px 6px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  nav button.on { background: #262117; color: var(--text); }

  .toast {
    position: fixed;
    bottom: 84px; left: 50%;
    transform: translate(-50%, 8px);
    background: var(--cream);
    color: #17140f;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  #view.enter, #strip.enter { animation: fadeUp 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"><div id="strip"></div><div class="card" id="view"></div></div>
<nav>
  <button data-tab="morning">morning</button>
  <button data-tab="evening">evening</button>
  <button data-tab="goals">goals</button>
  <button data-tab="trends">trends</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

// ---------- state ----------
const STORE_KEY = "daily-checkin-v1";
const MOOD_WORDS = ["drained","rough","low","meh","okay","fine","good","bright","great","radiant"]; // 1..10
const STREAK_MILESTONES = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 365];

// minimal line-drawn face: mouth curves from frown (1) to smile (10)
function faceSVG(v) {
  const t = (v - 5.5) / 4.5;              // -1 .. 1
  const bend = t * 11;                     // mouth curvature
  const my = 31 - t * 1.5;                 // mouth drifts up slightly as it smiles
  return `<svg viewBox="0 0 48 48" aria-hidden="true">
    <g class="face-stroke" fill="none" stroke-width="2.6" stroke-linecap="round">
      <circle cx="24" cy="24" r="20"/>
      <path d="M15 ${my} Q 24 ${my + bend} 33 ${my}"/>
    </g>
    <g class="face-fill">
      <circle cx="17.5" cy="19" r="2.1"/>
      <circle cx="30.5" cy="19" r="2.1"/>
    </g>
  </svg>`;
}

const defaultGoals = () => ([

// ideas offered in the goals editor
const GOAL_IDEAS = [

const defaultState = () => ({
  boundaries: ["22:00 cutoff", "no solo takeout", "bedtime before midnight"],
  goals: defaultGoals(),
  log: [],
  days: {}
});

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s === "object" && s.days) return Object.assign(defaultState(), s);
    }
  } catch (e) { /* corrupted store: start fresh */ }
  return defaultState();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("couldn't save — storage is full or blocked"); }
}

const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// validate + normalize an imported JSON payload into a clean state object.
// returns null if the shape isn't recognizable as check-in data.
const numOrNull = v => (typeof v === "number" && Number.isFinite(v) ? v : null);
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
function normalizeImportedState(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
  if (!raw.days || typeof raw.days !== "object" || Array.isArray(raw.days)) return null;

  const boundaries = Array.isArray(raw.boundaries)
    ? raw.boundaries.filter(b => typeof b === "string")
    : defaultState().boundaries;

  const days = {};
  for (const [key, rec] of Object.entries(raw.days)) {
    if (!DATE_RE.test(key) || !rec || typeof rec !== "object") continue;
    const out = { morning: null, evening: null };

    if (rec.morning && typeof rec.morning === "object") {
      out.morning = {
        sleep: numOrNull(rec.morning.sleep),
        mood: numOrNull(rec.morning.mood),
        body: numOrNull(rec.morning.body),
        intention: typeof rec.morning.intention === "string" ? rec.morning.intention : ""
      };
      if (typeof rec.morning.savedAt === "string") out.morning.savedAt = rec.morning.savedAt;
    }

    if (rec.evening && typeof rec.evening === "object") {
      const rawBounds = rec.evening.boundaries;
      const boundariesObj = {};
      if (rawBounds && typeof rawBounds === "object" && !Array.isArray(rawBounds)) {
        for (const [name, val] of Object.entries(rawBounds)) {
          boundariesObj[name] = (val === "held" || val === "slipped") ? val : null;
        }
      }
      out.evening = {
        mood: numOrNull(rec.evening.mood),
        body: numOrNull(rec.evening.body),
        boundaries: boundariesObj,
        gym: (rec.evening.gym === "went" || rec.evening.gym === "rest" || rec.evening.gym === "skipped") ? rec.evening.gym : null,
        happened: typeof rec.evening.happened === "string" ? rec.evening.happened : "",
        honest: typeof rec.evening.honest === "string" ? rec.evening.honest : ""
      };
      if (typeof rec.evening.savedAt === "string") out.evening.savedAt = rec.evening.savedAt;
    }

    days[key] = out;
  }

  // older exports have no goals: keep the defaults
  let goals = defaultGoals();
  if (Array.isArray(raw.goals)) {
    goals = [];
    for (const g of raw.goals) {
      if (!g || typeof g !== "object" || typeof g.id !== "string" || typeof g.title !== "string") continue;
      const out = {
        id: g.id,
        title: g.title,
        period: g.period === "month" ? "month" : "week",
        target: Number.isInteger(g.target) && g.target >= 1 && g.target <= 31 ? g.target : 1,
        icon: typeof g.icon === "string" && ICON_PATHS[g.icon] ? g.icon : "star"
      };
      if (typeof g.prompt === "string") out.prompt = g.prompt;
      if (Array.isArray(g.tags)) out.tags = g.tags.filter(t => typeof t === "string");
      if (typeof g.currentLabel === "string") {
        out.currentLabel = g.currentLabel;
        out.current = typeof g.current === "string" ? g.current : "";
      }
      goals.push(out);
    }
  }

  const log = [];
  if (Array.isArray(raw.log)) {
    for (const e of raw.log) {
      if (!e || typeof e !== "object" || typeof e.goal !== "string" || typeof e.text !== "string" || !DATE_RE.test(e.date)) continue;
      const out = { id: typeof e.id === "string" ? e.id : uid(), goal: e.goal, date: e.date, text: e.text };
      if (typeof e.tag === "string") out.tag = e.tag;
      log.push(out);
    }
  }

  return { boundaries, goals, log, days };
}

// ---------- dates ----------
function keyOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function todayKey(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return keyOf(d);
}
function addDays(key, n) {
  const d = parseKey(key);
  d.setDate(d.getDate() + n);
  return keyOf(d);
}
// weeks start on monday
function weekStart(key) {
  const d = parseKey(key);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return keyOf(d);
}
function prettyDate(key) {
  return parseKey(key).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}
function shortDate(key, withMonth) {
  const opts = withMonth ? { day: "numeric", month: "short" } : { weekday: "short", day: "numeric" };
  if (withMonth && key.slice(0, 4) !== todayKey().slice(0, 4)) opts.year = "numeric";
  return parseKey(key).toLocaleDateString("en-GB", opts).toLowerCase();
}
function day(key) {
  if (!state.days[key]) state.days[key] = { morning: null, evening: null };
  return state.days[key];
}

// ---------- streaks ----------
function morningFilled(m) {
  return !!m && (m.sleep != null || m.mood != null || m.body != null || !!(m.intention || "").trim());
}
function eveningFilled(ev) {
  return !!ev && (ev.mood != null || ev.body != null || !!ev.gym ||
    !!(ev.happened || "").trim() || !!(ev.honest || "").trim() ||
    Object.values(ev.boundaries || {}).some(Boolean));
}
// a day counts toward the streak if either check-in has something in it
function dayFilled(key) {
  const d = state.days[key];
  return !!d && (morningFilled(d.morning) || eveningFilled(d.evening));
}
// today not done yet doesn't break the streak — it's still alive until tomorrow
function currentStreak() {
  let key = todayKey();
  if (!dayFilled(key)) key = addDays(key, -1);
  let n = 0;
  while (dayFilled(key)) { n++; key = addDays(key, -1); }
  return n;
}
function bestStreak() {
  const keys = Object.keys(state.days).filter(dayFilled).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) {
    run = prev && addDays(prev, 1) === k ? run + 1 : 1;
    best = Math.max(best, run);
    prev = k;
  }
  return best;
}

// ---------- goals ----------
function periodOf(goal, key) { return goal.period === "month" ? key.slice(0, 7) : weekStart(key); }
function prevPeriod(goal, p) {
  if (goal.period === "month") {
    const [y, m] = p.split("-").map(Number);
    return keyOf(new Date(y, m - 2, 1)).slice(0, 7);
  }
  return addDays(p, -7);
}
function goalEntries(goal) { return state.log.filter(e => e.goal === goal.id); }
function periodCount(goal, p) { return goalEntries(goal).filter(e => periodOf(goal, e.date) === p).length; }
// consecutive weeks/months with the goal met; an unfinished current period doesn't break it
function goalStreak(goal) {
  const counts = {};
  for (const e of goalEntries(goal)) { const p = periodOf(goal, e.date); counts[p] = (counts[p] || 0) + 1; }
  let p = periodOf(goal, todayKey());
  if ((counts[p] || 0) < goal.target) p = prevPeriod(goal, p);
  let n = 0;
  while ((counts[p] || 0) >= goal.target) { n++; p = prevPeriod(goal, p); }
  return n;
}
function periodLeft(goal) {
  const t = parseKey(todayKey());
  const n = goal.period === "month"
    ? new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate() - t.getDate() + 1
    : 7 - (t.getDay() + 6) % 7;
  return n === 1 ? "last day" : `${n} days left`;
}
const unit = (goal, n) => goal.period === "month" ? (n === 1 ? "month" : "months") : (n === 1 ? "week" : "weeks");

// ---------- view state ----------
let tab = "morning";
let range = 7;
let editingBoundaries = false;
// which day the evening tab is writing to: 0 = today, -1 = yesterday
let eveningOffset = 0;
let goalsEditing = false;
let logging = null;            // goal id with the log form open
let logDraft = null;           // { text, tag, date }
const historyOpen = new Set(); // goal ids with full history expanded

function eveningKey() { return todayKey(eveningOffset); }

function morningModel(key) {
  const saved = state.days[key]?.morning;
  return saved ? clone(saved) : { sleep: null, mood: null, body: null, intention: "" };
}
function eveningModel(key) {
  const saved = state.days[key]?.evening;
  const ev = saved ? clone(saved) : { mood: null, body: null, boundaries: {}, gym: null, happened: "", honest: "" };
  if (!ev.boundaries || typeof ev.boundaries !== "object") ev.boundaries = {};
  // pick up boundaries added since last save
  for (const b of state.boundaries) if (!(b in ev.boundaries)) ev.boundaries[b] = null;
  return ev;
}

// autosave: every change goes straight to storage
function commit(key, part, model) {
  const today = todayKey();
  const wasFilled = dayFilled(today);
  model.savedAt = new Date().toISOString();
  day(key)[part] = clone(model);
  save();
  flashSaved();
  if (!wasFilled && dayFilled(today)) {
    renderStrip(true);
    const n = currentStreak();
    if (STREAK_MILESTONES.includes(n)) toast(`${n} days in a row — keep going`);
    else if (n > 1) toast(`day ${n} of your streak`);
  } else {
    renderStrip();
  }
}

function flashSaved() {
  const el = view.querySelector(".saved-note");
  if (!el) return;
  el.textContent = "saved ✓";
  el.classList.add("fresh");
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(() => el.classList.remove("fresh"), 1200);
}

// ---------- rendering helpers ----------
const view = document.getElementById("view");
const strip = document.getElementById("strip");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const SCALE_COLORS = {
  sleep: ["var(--sleep)", "var(--sleep-dim)"],
  mood: ["var(--mood)", "var(--mood-dim)"],
  body: ["var(--body)", "var(--body-dim)"]
};

function scaleHTML(id, label, value, color, dimColor, withFaces) {
  if (value == null) value = null; // treat undefined the same as null
  let segs = "";
  for (let i = 1; i <= 10; i++) {
    const on = value !== null && i <= value;
    const bg = on ? (i === value ? color : dimColor) : "";
    segs += `<button tabindex="-1" data-v="${i}" class="${i === value ? "tip" : ""}" ${bg ? `style="background:${bg}"` : ""} aria-hidden="true"></button>`;
  }
  let faces = "";
  if (withFaces) {
    faces = `<div class="face-row">` + MOOD_WORDS.map((w, i) =>
      `<button data-v="${i + 1}" class="${value === i + 1 ? "on" : ""}" aria-label="${label} ${i + 1} — ${w}">${faceSVG(i + 1)}</button>`
    ).join("") + `</div>
    <div class="mood-word">${value ? moodWord(value) : ""}</div>`;
  }
  return `<div class="section scale" data-scale-id="${id}">
    <div class="scale-head">
      <span class="label">${label}</span>
      <span class="scale-val serif ${value === null ? "empty" : ""}" style="color:${value === null ? "" : color}">${value === null ? "–" : value}</span>
    </div>
    <div class="segments" role="slider" tabindex="0" style="--accent:${color}" aria-label="${label}" aria-valuemin="1" aria-valuemax="10" aria-valuenow="${value ?? 0}">${segs}</div>
    ${faces}
  </div>`;
}

// update one scale's DOM in place (used while sliding — no full re-render)
function paintScale(root, id, value) {
  if (value == null) value = null; // treat undefined the same as null
  const [color, dim] = SCALE_COLORS[id];
  root.querySelectorAll(".segments button").forEach((b, i) => {
    const n = i + 1;
    b.style.background = value !== null && n <= value ? (n === value ? color : dim) : "";
    b.classList.toggle("tip", n === value);
  });
  const val = root.querySelector(".scale-val");
  const changed = val.textContent !== String(value === null ? "–" : value);
  val.textContent = value === null ? "–" : value;
  val.classList.toggle("empty", value === null);
  val.style.color = value === null ? "" : color;
  if (changed && value !== null) {
    val.classList.remove("bump");
    void val.offsetWidth;
    val.classList.add("bump");
  }
  root.querySelector(".segments").setAttribute("aria-valuenow", value ?? 0);
  root.querySelectorAll(".face-row button").forEach(b => b.classList.toggle("on", Number(b.dataset.v) === value));
  const word = root.querySelector(".mood-word");
  if (word) {
    const w = value ? moodWord(value) : "";
    if (word.textContent !== w) {
      word.textContent = w;
      word.classList.remove("wisp");
      void word.offsetWidth;
      if (w) word.classList.add("wisp");
    }
  }
}

// slide / tap interaction for every scale in the current view
function wireScales(model, onChange) {
  view.querySelectorAll(".scale").forEach(root => {
    const id = root.dataset.scaleId;
    const seg = root.querySelector(".segments");
    const set = v => { model[id] = v; paintScale(root, id, v); onChange(); };
    const valueAt = e => {
      const r = seg.getBoundingClientRect();
      return Math.min(10, Math.max(1, Math.ceil((e.clientX - r.left) / r.width * 10)));
    };
    let startVal = null, slid = false;
    seg.addEventListener("pointerdown", e => {
      e.preventDefault();
      seg.setPointerCapture(e.pointerId);
      startVal = model[id];
      slid = false;
      const v = valueAt(e);
      if (v !== model[id]) set(v);
    });
    seg.addEventListener("pointermove", e => {
      if (!seg.hasPointerCapture(e.pointerId)) return;
      const v = valueAt(e);
      if (v !== model[id]) { slid = true; set(v); }
    });
    seg.addEventListener("pointerup", () => {
      // a plain tap on the already-selected value clears it
      if (!slid && startVal !== null && model[id] === startVal) set(null);
    });
    root.querySelectorAll(".face-row button").forEach(b => b.onclick = () => {
      const v = Number(b.dataset.v);
      set(model[id] === v ? null : v);
    });
    seg.addEventListener("keydown", e => {
      const cur = model[id];
      let v = null;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") v = Math.min(10, (cur ?? 0) + 1);
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") v = Math.max(1, (cur ?? 2) - 1);
      else if (e.key === "Home") v = 1;
      else if (e.key === "End") v = 10;
      else return;
      e.preventDefault();
      set(v);
    });
  });
}

function moodWord(v) { return v ? MOOD_WORDS[v - 1] : ""; }
function moodFaceInline(v) { return v ? `<span class="mood-face-inline">${faceSVG(v)}</span>` : ""; }

// ---------- streak strip (top of morning / evening) ----------
function renderStrip(pop) {
  updateNavDots();
  if (tab !== "morning" && tab !== "evening") { strip.innerHTML = ""; return; }
  const today = todayKey();
  const done = dayFilled(today);
  const cur = currentStreak();
  const best = bestStreak();
  const hint = done ? "today's in ✓"
    : cur ? "check in today to keep it going"
    : "check in today to start one";

  const start = weekStart(today);
  let week = "";
  for (let i = 0; i < 7; i++) {
    const k = addDays(start, i);
    const d = state.days[k];
    const m = morningFilled(d?.morning), e = eveningFilled(d?.evening);
    const cls = k === today ? "today" : k > today ? "future" : "";
    const letter = parseKey(k).toLocaleDateString("en-GB", { weekday: "narrow" }).toLowerCase();
    const aria = `${prettyDate(k)}: morning ${m ? "done" : "not done"}, evening ${e ? "done" : "not done"}`;
    week += `<div class="wd ${cls}" role="img" aria-label="${aria}"><span>${letter}</span><div class="pip"><i class="${m ? "on" : ""}"></i><i class="${e ? "on" : ""}"></i></div></div>`;
  }

  const chips = state.goals.map(g => {
    const n = periodCount(g, periodOf(g, today));
    const met = n >= g.target;
    return `<button class="chip ${met ? "done" : ""}" data-goto="goals" aria-label="${esc(g.title)}: ${n} of ${g.target} this ${g.period}">${icon(g.icon)}<span>${met ? "✓" : `${n}/${g.target}`}</span></button>`;
  }).join("");

  strip.innerHTML = `<div class="strip">
    <div class="streak-row">
      <span class="flame ${done ? "lit" : ""} ${pop ? "pop" : ""}">${icon("flame")}</span>
      <span class="streak-num">${cur}</span>
      <span class="streak-txt">${cur === 1 ? "day" : "days"} in a row<small>${hint}</small></span>
      <span class="best">best<b>${best}</b></span>
    </div>
    <div class="week">${week}</div>
    <div class="week-legend">left half morning · right half evening</div>
    ${chips ? `<div class="chips">${chips}</div>` : ""}
  </div>`;
  strip.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => setTab(b.dataset.goto));
}

function updateNavDots() {
  const d = state.days[todayKey()];
  const flags = { morning: morningFilled(d?.morning), evening: eveningFilled(d?.evening) };
  document.querySelectorAll("nav button").forEach(b => {
    const want = !!flags[b.dataset.tab];
    const dot = b.querySelector(".nav-dot");
    if (want && !dot) b.insertAdjacentHTML("beforeend", `<span class="nav-dot" aria-hidden="true"></span>`);
    if (!want && dot) dot.remove();
  });

// ---------- morning tab ----------

        <button data-b="${esc(b)}" data-s="slipped" class="${st === "slipped" ? "slipped-on" : ""}">slipped</button>
      </span>
      ${editingBoundaries ? `<button class="remove" data-rm="${esc(b)}" aria-label="remove ${esc(b)}">✕</button>` : ""}
    </div>`;
  }).join("");

  const gym = ev.gym;
  const dayTabs = [[-1, "yesterday"], [0, "today"]].map(([off, label]) => {
    const saved = eveningFilled(state.days[todayKey(off)]?.evening);
    return `<button data-day="${off}" class="${eveningOffset === off ? "on" : ""}">${label}${saved ? `<span class="mark"></span>` : ""}</button>`;
  }).join("");

  view.innerHTML = `
    <h1>${prettyDate(key)}</h1>
    <div class="head-row">
      <div class="sub">evening · <span class="saved-note">${ev.savedAt ? "saved ✓" : "saves as you go"}</span></div>
      <div class="range-toggle day-toggle">${dayTabs}</div>
    </div>
    ${summary}
    <div class="section">
      <div class="label">how are you now?</div>
    </div>
    ${scaleHTML("mood", "mood", ev.mood, "var(--mood)", "var(--mood-dim)", true)}
    ${scaleHTML("body", "body", ev.body, "var(--body)", "var(--body-dim)", false)}
    <div class="section">
      <div class="scale-head">
        <span class="label">boundaries</span>
        <button class="edit-link" id="edit-bounds">${editingBoundaries ? "done" : "edit"}</button>
      </div>
      ${boundaryRows}
      ${editingBoundaries ? `<div class="add-boundary">
        <input id="new-boundary" placeholder="new boundary…" maxlength="40">
        <button id="add-boundary-btn" aria-label="add boundary">+</button>
      </div>` : ""}
    </div>
    <div class="section">
      <div class="row" style="border:none;padding:0">
        <span class="name">gym</span>
        <span class="pills">
          <button data-gym="went" class="${gym === "went" ? "held-on" : ""}">went</button>
          <button data-gym="rest" class="${gym === "rest" ? "neutral-on" : ""}">rest</button>
          <button data-gym="skipped" class="${gym === "skipped" ? "slipped-on" : ""}">skipped</button>
        </span>
      </div>
    </div>
    <div class="section">
      <div class="label">what happened</div>
      <textarea id="happened" placeholder="the shape of the day">${esc(ev.happened)}</textarea>
    </div>
    <div class="section">
      <div class="label">one honest thing</div>
      <textarea id="honest" placeholder="say it plainly">${esc(ev.honest)}</textarea>
    </div>
    <button class="btn-primary" id="done-evening">done</button>
    <button class="btn-ghost" id="copy-md">copy daily note as markdown</button>
  `;

  wireScales(ev, onChange);
  view.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
    eveningOffset = Number(b.dataset.day);
    renderEvening();
    window.scrollTo(0, 0);
  });
  // tapping the selected pill again clears it
  view.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
    const name = b.dataset.b;
    ev.boundaries[name] = ev.boundaries[name] === b.dataset.s ? null : b.dataset.s;
    onChange();
    renderEvening();
  });
  view.querySelectorAll("[data-gym]").forEach(b => b.onclick = () => {
    ev.gym = ev.gym === b.dataset.gym ? null : b.dataset.gym;
    onChange();
    renderEvening();
  });
  view.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const name = b.dataset.rm;
    if (!confirm(`Remove boundary "${name}"? Past check-ins that recorded it are kept, but it won't be tracked going forward.`)) return;
    state.boundaries = state.boundaries.filter(x => x !== name);
    // keep a recorded held/slipped for trends, drop an empty slot
    const saved = state.days[key]?.evening;
    if (saved?.boundaries && saved.boundaries[name] == null) delete saved.boundaries[name];
    save();
    renderEvening();
  });
  view.querySelector("#edit-bounds").onclick = () => { editingBoundaries = !editingBoundaries; renderEvening(); };
  const addInput = view.querySelector("#new-boundary");
  if (addInput) {
    const add = () => {
      const name = addInput.value.trim();
      if (!name || state.boundaries.some(x => x.toLowerCase() === name.toLowerCase())) return;
      state.boundaries.push(name);
      save();
      renderEvening();
      view.querySelector("#new-boundary")?.focus();
    };
    view.querySelector("#add-boundary-btn").onclick = add;
    addInput.onkeydown = e => { if (e.key === "Enter") add(); };
  }
  view.querySelector("#happened").oninput = e => { ev.happened = e.target.value; onChange(); };
  view.querySelector("#honest").oninput = e => { ev.honest = e.target.value; onChange(); };
  view.querySelector("#done-evening").onclick = e => {
    pulse(e.target);
    if (!eveningFilled(ev)) { toast("nothing filled in yet"); return; }
    // the day toggle marks days that already have an evening saved
    const tabBtn = view.querySelector(`[data-day="${eveningOffset}"]`);
    if (tabBtn && !tabBtn.querySelector(".mark")) tabBtn.insertAdjacentHTML("beforeend", `<span class="mark"></span>`);
    toast(eveningOffset === 0 ? "evening saved — sleep well" : "yesterday evening saved");
  };
  view.querySelector("#copy-md").onclick = () => copyMarkdown(key, ev);
}

function copyMarkdown(key, ev) {
  const m = state.days[key]?.morning;
  const lines = [`# ${prettyDate(key)}`, ""];
  if (m) {
    lines.push("## morning");
    lines.push(`- sleep: ${m.sleep ?? "–"}/10`);
    lines.push(`- mood: ${m.mood ?? "–"}/10${m.mood ? ` (${moodWord(m.mood)})` : ""}`);
    lines.push(`- body: ${m.body ?? "–"}/10`);
    if (m.intention) lines.push(`- intention: ${m.intention}`);
    lines.push("");
  }
  if (ev) {
    lines.push("## evening");
    lines.push(`- mood: ${ev.mood ?? "–"}/10${ev.mood ? ` (${moodWord(ev.mood)})` : ""}`);
    lines.push(`- body: ${ev.body ?? "–"}/10`);
    const bounds = Object.entries(ev.boundaries).filter(([, s]) => s);
    if (bounds.length) {
      lines.push("- boundaries:");
      for (const [name, s] of bounds) lines.push(`  - ${name}: ${s}`);
    }
    if (ev.gym) lines.push(`- gym: ${ev.gym}`);
    if (ev.happened) lines.push(`- what happened: ${ev.happened}`);
    if (ev.honest) lines.push(`- one honest thing: ${ev.honest}`);
    lines.push("");
  }
  const logged = state.log.filter(e => e.date === key);
  if (logged.length) {
    lines.push("## goals");
    for (const e of logged) {
      const g = state.goals.find(x => x.id === e.goal);
      lines.push(`- ${g ? g.title : "goal"}: ${e.text}${e.tag ? ` (${e.tag})` : ""}`);
    }
  }
  const text = lines.join("\n").trim() + "\n";
  navigator.clipboard.writeText(text).then(
    () => toast("copied"),
    () => toast("copy failed")
  );
}

// ---------- goals tab ----------
function goalCardHTML(g) {
  const today = todayKey();
  const p = periodOf(g, today);
  const all = goalEntries(g).sort((a, b) => b.date.localeCompare(a.date));
  const cur = all.filter(e => periodOf(g, e.date) === p);
  const n = cur.length;
  const met = n >= g.target;
  const streak = goalStreak(g);
  const id = esc(g.id);

  let bar = "";
  for (let i = 0; i < g.target; i++) bar += `<i class="${i < n ? "on" : ""}"></i>`;

  const entryLi = (e, withMonth) => `<li>
    <span class="e-date">${shortDate(e.date, withMonth)}</span>
    <span class="e-text">${esc(e.text)}</span>
    ${e.tag ? `<span class="tag">${esc(e.tag)}</span>` : ""}
    <button class="remove" data-rm-entry="${esc(e.id)}" aria-label="delete ${esc(e.text)}">✕</button>
  </li>`;

  const histOpen = historyOpen.has(g.id);
  const shown = histOpen ? all : cur;

  let streakLine;
  if (streak > 0) streakLine = `<div class="goal-streak">${icon("flame")}${streak} ${unit(g, streak)} in a row</div>`;
  else streakLine = `<div class="goal-streak cold">${icon("flame")}start a streak this ${g.period}</div>`;

  let form = "";
  if (logging === g.id) {
    const tags = (g.tags || []).map(t =>
      `<button data-tag="${esc(t)}" class="${logDraft.tag === t ? "flame-on" : ""}">${esc(t)}</button>`).join("");
    form = `<div class="log-form">
      <input class="field" id="log-text" maxlength="100" placeholder="${esc(g.prompt || "what did you do?")}" value="${esc(logDraft.text)}">
      ${tags ? `<div class="pills">${tags}</div>` : ""}
      <input class="field" type="date" id="log-date" value="${logDraft.date}" max="${today}" aria-label="date">
      <div class="row-btns">
        <button class="btn-ghost" id="log-cancel">cancel</button>
        <button class="btn-primary" id="log-save">save</button>
      </div>
    </div>`;
  }

  return `<div class="goal ${met ? "done" : ""}" data-goal="${id}">
    <div class="goal-top">
      <span class="goal-icon">${met ? icon("check") : icon(g.icon)}</span>
      <div class="goal-main">
        <div class="goal-title">${esc(g.title)}</div>
        <div class="goal-meta">${met ? `done this ${g.period}` : `this ${g.period} · ${periodLeft(g)}`}</div>
      </div>
      <div class="goal-count">${n}<span>/${g.target}</span></div>
    </div>
    <div class="goal-bar">${bar}</div>
    ${streakLine}
    ${g.currentLabel !== undefined ? `<div class="current-read">
      <div class="label">${esc(g.currentLabel)}</div>
      <input class="field" data-current="${id}" maxlength="100" placeholder="title, author…" value="${esc(g.current || "")}">
    </div>` : ""}
    ${shown.length ? `<ul class="entries">${shown.map(e => entryLi(e, histOpen)).join("")}</ul>` : ""}
    ${form || `<div class="goal-actions">
      <button class="btn-ghost" data-log="${id}">+ log it</button>
      ${all.length > cur.length || histOpen ? `<button class="edit-link" data-hist="${id}">${histOpen ? "less" : `all (${all.length})`}</button>` : ""}
      ${goalsEditing ? `<button class="remove" data-rm-goal="${id}" aria-label="remove goal ${esc(g.title)}">✕</button>` : ""}
    </div>`}
  </div>`;
}

function renderGoals() {

  const collectionName = g => ({ "new-place": "new places", "new-food": "new foods", "book": "books" }[g.id] || g.title);
  const existing = new Set(state.goals.map(g => g.title.toLowerCase()));
  const ideas = GOAL_IDEAS.filter(i => !existing.has(i.title.toLowerCase()));

  view.innerHTML = `
    <div class="trends-head">
      <h1 style="font-size:1.7rem">goals</h1>
      <button class="edit-link" id="edit-goals">${goalsEditing ? "done" : "edit"}</button>
    </div>
    <div class="sub">small adventures, every week and month</div>
    ${state.goals.map(goalCardHTML).join("") || `<div class="empty-note">no goals yet — add one below</div>`}
    ${goalsEditing ? `
      <div class="section">

  view.querySelector("#edit-goals").onclick = () => { goalsEditing = !goalsEditing; renderGoals(); };

    logDraft = { text: "", tag: null, date: todayKey() };
    renderGoals();
    view.querySelector("#log-text")?.focus();
  });
  view.querySelectorAll("[data-hist]").forEach(b => b.onclick = () => {
    const id = b.dataset.hist;
    historyOpen.has(id) ? historyOpen.delete(id) : historyOpen.add(id);
    renderGoals();
  });
  view.querySelectorAll("[data-current]").forEach(inp => inp.oninput = () => {
    const g = state.goals.find(x => x.id === inp.dataset.current);
    if (g) { g.current = inp.value; save(); }
  });
  view.querySelectorAll("[data-rm-entry]").forEach(b => b.onclick = () => {
    const e = state.log.find(x => x.id === b.dataset.rmEntry);
    if (!e || !confirm(`Delete "${e.text}"?`)) return;
    state.log = state.log.filter(x => x !== e);
    save();
    renderGoals();
  });
  view.querySelectorAll("[data-rm-goal]").forEach(b => b.onclick = () => {
    const g = state.goals.find(x => x.id === b.dataset.rmGoal);
    if (!g || !confirm(`Remove the goal "${g.title}"? Everything you logged for it is deleted too.`)) return;
    state.goals = state.goals.filter(x => x !== g);
    state.log = state.log.filter(e => e.goal !== g.id);
    save();
    renderGoals();
  });

  // log form
  const text = view.querySelector("#log-text");
  if (text) {
    const g = state.goals.find(x => x.id === logging);
    text.oninput = () => { logDraft.text = text.value; };
    view.querySelector("#log-date").onchange = e => { logDraft.date = e.target.value; };
    view.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => {
      logDraft.tag = logDraft.tag === b.dataset.tag ? null : b.dataset.tag;
      renderGoals();
      const t = view.querySelector("#log-text");
      t.focus();
      t.setSelectionRange(t.value.length, t.value.length);
    });
    view.querySelector("#log-cancel").onclick = () => { logging = null; renderGoals(); };
    const submit = () => {
      const t = logDraft.text.trim();
      if (!t) { text.focus(); toast("write a few words first"); return; }
      const date = DATE_RE.test(logDraft.date) && logDraft.date <= todayKey() ? logDraft.date : todayKey();
      const p = periodOf(g, todayKey());
      const before = periodCount(g, p);
      const entry = { id: uid(), goal: g.id, date, text: t };
      if (logDraft.tag) entry.tag = logDraft.tag;
      state.log.push(entry);
      save();
      logging = null;
      renderGoals();
      if (periodOf(g, date) === p && before < g.target && before + 1 >= g.target) {
        const s = goalStreak(g);
        toast(s > 1 ? `done — ${s} ${unit(g, s)} in a row` : `done for this ${g.period}`);
        sparkle(view.querySelector(`[data-goal="${CSS.escape(g.id)}"]`));
      } else {
        toast("logged");
      }
    };
    view.querySelector("#log-save").onclick = submit;
    text.onkeydown = e => { if (e.key === "Enter") submit(); };
  }

  // editor
  const addGoal = (title, period, target) => {
    title = title.trim();
    if (!title) return;
    if (state.goals.some(x => x.title.toLowerCase() === title.toLowerCase())) { toast("you already have that one"); return; }
    state.goals.push({ id: uid(), title, period, target, icon: "star" });
    save();
    renderGoals();
  };
  const newGoal = view.querySelector("#new-goal");
  if (newGoal) {
    const go = () => addGoal(newGoal.value, view.querySelector("#new-goal-period").value, Number(view.querySelector("#new-goal-target").value));
    view.querySelector("#add-goal-btn").onclick = go;
    newGoal.onkeydown = e => { if (e.key === "Enter") go(); };
  }
  view.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
    const i = GOAL_IDEAS[Number(b.dataset.idea)];
    addGoal(i.title, i.period, 1);
  });
}

function sparkle(el) {
  if (!el || reducedMotion()) return;
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    const a = (i / 14) * Math.PI * 2 + Math.random() * 0.4;
    const r = 60 + Math.random() * 50;
    s.style.setProperty("--dx", `${Math.cos(a) * r}px`);
    s.style.setProperty("--dy", `${Math.sin(a) * r * 0.6}px`);
    el.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}

// ---------- trends tab ----------
function collectWindow(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const key = todayKey(-i);
    const d = state.days[key];
    const m = d?.morning, ev = d?.evening;
    out.push({
      key,
      sleep: m?.sleep ?? null,
      mood: ev?.mood ?? m?.mood ?? null,
      body: ev?.body ?? m?.body ?? null,
      boundaries: ev?.boundaries ?? null
    });
  }
  return out;
}
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const fmt1 = x => x === null ? "–" : (Math.round(x * 10) / 10).toFixed(1);

function chartSVG(days) {
  const W = 640, H = 260, padL = 34, padR = 14, padT = 16, padB = 30;
  const x = i => padL + (days.length === 1 ? 0 : i * (W - padL - padR) / (days.length - 1));
  const y = v => padT + (10 - v) * (H - padT - padB) / 9; // 1..10
  const series = [["sleep", "var(--sleep)"], ["mood", "var(--mood)"], ["body", "var(--body)"]];
  let g = "";
  for (const gy of [1, 4, 7, 10]) {
    g += `<line x1="${padL}" y1="${y(gy)}" x2="${W - padR}" y2="${y(gy)}" stroke="#2a251d" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y(gy) + 4}" fill="#6b6452" font-size="12" text-anchor="end">${gy}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(days.length / 7));
  days.forEach((d, i) => {
    if (i % labelEvery === 0 || i === days.length - 1) {
      const [, m, dd] = d.key.split("-");
      g += `<text x="${x(i)}" y="${H - 8}" fill="#6b6452" font-size="12" text-anchor="middle">${Number(dd)}.${m}</text>`;
    }
  });
  for (const [field, color] of series) {
    let path = "", prev = false;
    days.forEach((d, i) => {
      const v = d[field];
      if (v === null) { prev = false; return; }
      path += (prev ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      prev = true;
      g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${color}"/>`;
    });
    if (path) g = `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="2" opacity="0.8"/>` + g;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="sleep, mood and body over time">${g}</svg>`;
}

function renderTrends() {
  const days = collectWindow(range);
  const sleepA = avg(days.map(d => d.sleep).filter(v => v !== null));
  const moodVals = days.map(d => d.mood).filter(v => v !== null);
  const moodA = avg(moodVals);
  const bodyA = avg(days.map(d => d.body).filter(v => v !== null));
  const hasData = days.some(d => d.sleep !== null || d.mood !== null || d.body !== null);
  const checkedIn = days.filter(d => dayFilled(d.key)).length;

  // boundary hold rates
  const holdRate = name => {
    let held = 0, total = 0;
    for (const d of days) {
      const s = d.boundaries?.[name];
      if (s === "held") { held++; total++; }
      else if (s === "slipped") total++;
    }
    return total ? Math.round(100 * held / total) : null;
  };
  const bstats = state.boundaries.map(name => ({ name, pct: holdRate(name) }));

  // boundaries that show up in this window's records but aren't tracked anymore
  const currentBoundaries = new Set(state.boundaries);
  const pastNames = new Set();
  for (const d of days) {
    if (!d.boundaries) continue;
    for (const name of Object.keys(d.boundaries)) {
      if (!currentBoundaries.has(name)) pastNames.add(name);
    }
  }
  const pastStats = [...pastNames].map(name => ({ name, pct: holdRate(name) }));

  // mood x sleep split
  const paired = days.filter(d => d.sleep !== null && d.mood !== null);
  let hi = null, lo = null;
  if (paired.length >= 2) {
    const sMean = avg(paired.map(d => d.sleep));
    const hiDays = paired.filter(d => d.sleep >= sMean);
    const loDays = paired.filter(d => d.sleep < sMean);
    if (hiDays.length && loDays.length) {
      hi = avg(hiDays.map(d => d.mood));
      lo = avg(loDays.map(d => d.mood));
    }
  }

  view.innerHTML = `
    <div class="trends-head">
      <h1 style="font-size:1.7rem">trends</h1>
      <div class="range-toggle">
        ${[7, 14, 30].map(n => `<button data-range="${n}" class="${range === n ? "on" : ""}">${n}d</button>`).join("")}
      </div>
    </div>
    <div class="avgs">
      <span><span class="dot" style="background:var(--sleep)"></span>sleep <b>${fmt1(sleepA)}</b></span>
      <span><span class="dot" style="background:var(--mood)"></span>mood <b>${fmt1(moodA)}</b>${moodA !== null ? moodFaceInline(Math.round(moodA)) : ""}</span>
      <span><span class="dot" style="background:var(--body)"></span>body <b>${fmt1(bodyA)}</b></span>
    </div>
    <div class="chart-box">${hasData ? chartSVG(days) : `<div class="empty-note" style="margin:20px">no check-ins yet — trends appear once you save a few days</div>`}</div>
    <div class="mini-card">
      <div class="label">streaks</div>
      <div class="avgs">
        <span><span class="dot" style="background:var(--flame)"></span>now <b>${currentStreak()}</b></span>
        <span>best <b>${bestStreak()}</b></span>
        <span>checked in <b>${checkedIn}/${range}</b></span>
      </div>
    </div>
    <div class="section">
      <div class="label">boundaries</div>
      ${bstats.map(b => `<div class="bar-row">
        <span class="name">${esc(b.name)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:0" data-w="${b.pct ?? 0}"></span></span>
        <span class="pct">${b.pct === null ? "–" : b.pct + "%"}</span>
      </div>`).join("")}
      ${pastStats.length ? `
        <div class="label" style="margin-top:14px;color:var(--faint);font-size:0.72rem">past boundaries</div>
        ${pastStats.map(b => `<div class="bar-row" style="opacity:0.6">
          <span class="name" style="color:var(--faint)">${esc(b.name)}</span>
          <span class="bar-track"><span class="bar-fill" style="width:0;background:var(--faint)" data-w="${b.pct ?? 0}"></span></span>
          <span class="pct" style="color:var(--faint)">${b.pct === null ? "–" : b.pct + "%"}</span>
        </div>`).join("")}
      ` : ""}
    </div>
    <div class="mini-card">
      <div class="label">mood × sleep</div>
      ${hi !== null ? `
        <div class="bar-row"><span class="name" style="color:var(--muted)">higher-sleep days</span>
          <span class="bar-track"><span class="bar-fill gold-hi" style="width:0" data-w="${hi * 10}"></span></span>
          <span class="pct">${fmt1(hi)}</span></div>
        <div class="bar-row"><span class="name" style="color:var(--muted)">lower-sleep days</span>
          <span class="bar-track"><span class="bar-fill gold-lo" style="width:0" data-w="${lo * 10}"></span></span>
          <span class="pct">${fmt1(lo)}</span></div>`
      : `<div class="empty-note">needs a few days with both sleep and mood logged</div>`}
    </div>
    <button class="btn-ghost" id="export-json" style="margin-top:30px">export data (json)</button>
    <button class="btn-ghost" id="import-json">import data</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  `;
  view.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { range = Number(b.dataset.range); renderTrends(); });
  view.querySelector("#export-json").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `daily-checkin-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const fileInput = view.querySelector("#import-file");
  view.querySelector("#import-json").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    f.text().then(text => {
      const raw = JSON.parse(text);
      const normalized = normalizeImportedState(raw);
      if (!normalized) throw new Error("bad file");
      if (!confirm("Import this file? This replaces all current check-ins and goals on this device.")) return;
      state = normalized;
      save();
      editingBoundaries = false;
      goalsEditing = false;
      logging = null;
      renderTrends();
      toast("imported");
    }).catch(() => toast("couldn't read that file"))
      .finally(() => { fileInput.value = ""; });
  };
  animateTrends();
}

// draw the chart lines in and grow the bars once the trends view is on screen
function animateTrends() {
  if (reducedMotion()) {
    view.querySelectorAll(".bar-fill[data-w]").forEach(f => { f.style.width = f.dataset.w + "%"; });
    return;
  }
  view.querySelectorAll(".chart-box path").forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  view.querySelectorAll(".chart-box circle").forEach((c, i) => {
    c.style.opacity = "0";
    c.style.transition = `opacity 0.3s ease ${0.3 + i * 0.04}s`;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    view.querySelectorAll(".chart-box path").forEach(p => {
      p.style.transition = "stroke-dashoffset 1s ease";
      p.style.strokeDashoffset = "0";
    });
    view.querySelectorAll(".chart-box circle").forEach(c => { c.style.opacity = "1"; });
    view.querySelectorAll(".bar-fill[data-w]").forEach(f => { f.style.width = f.dataset.w + "%"; });
  }));
}

// ---------- shell ----------
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2000);
}

function pulse(btn) {
  btn.classList.remove("pulse");
  void btn.offsetWidth;
  btn.classList.add("pulse");
}

const renderers = { morning: renderMorning, evening: renderEvening, goals: renderGoals, trends: renderTrends };
function setTab(name) {
  tab = name;
  document.querySelectorAll("nav button").forEach(b => {
    const active = b.dataset.tab === name;
    b.classList.toggle("on", active);
    if (active) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  renderStrip();
  renderers[name]();
  for (const el of [view, strip]) {
    el.classList.remove("enter");
    void el.offsetWidth;
    el.classList.add("enter");
  }
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

// default tab: evening after 17:00 — and in the small hours it's still last night,
// so open the evening tab already pointed at yesterday
const hour = new Date().getHours();
if (hour < 5) {
  eveningOffset = -1;
  setTab("evening");
} else {
  setTab(hour >= 17 ? "evening" : "morning");
}

const isSecureHost = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
if ("serviceWorker" in navigator && isSecureHost) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
