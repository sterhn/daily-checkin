// ---------- reading back: journal + week story ----------
const hasText = s => !!(s || "").trim();
const listJoin = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
const GYM_TEXT = { went: "went", rest: "rest day", skipped: "skipped" };

// "sleep 4 · body 6 · mood 5 → 7" — morning to evening when both are there
function scoreBits(key) {
  const m = state.days[key]?.morning, ev = state.days[key]?.evening;
  const arc = (a, b) => a != null && b != null && a !== b ? `${a} → ${b}` : (b ?? a);
  const bits = [];
  if (m?.sleep != null) bits.push(`sleep ${m.sleep}`);
  const body = arc(m?.body, ev?.body);
  if (body != null) bits.push(`body ${body}`);
  const mood = arc(m?.mood, ev?.mood);
  if (mood != null) bits.push(`mood ${mood}`);
  return bits;
}
// the day's words as [label, text] pairs; `full` adds boundaries and gym
function storyLines(key, full) {
  const m = state.days[key]?.morning, ev = state.days[key]?.evening;
  const out = [];
  const add = (label, text) => { if (hasText(text)) out.push([label, text.trim()]); };
  add("intention", m?.intention);
  add("what happened", ev?.happened);
  add("one honest thing", ev?.honest);
  if (full) {
    const held = [], slipped = [];
    for (const [name, s] of Object.entries(ev?.boundaries || {})) {
      if (s === "held") held.push(name);
      else if (s === "slipped") slipped.push(name);
    }
    const parts = [];
    if (held.length) parts.push(`held ${listJoin(held)}`);
    if (slipped.length) parts.push(`slipped on ${listJoin(slipped)}`);
    if (parts.length) out.push(["boundaries", parts.join("; ")]);
    if (ev?.gym) out.push(["gym", GYM_TEXT[ev.gym]]);
  }
  add("spent", ev?.spent);
  return out;
}
// how he looked that day: the day's mood (evening first) as a face and a word
function dayPolaroid(key) {
  const mood = collectDay(key).mood;
  const face = mood != null ? exprFor(mood) : "thinking";
  return `<div class="mini-pol" aria-hidden="true"><div class="ph">${charHTML(face)}</div><div class="cap">${mood != null ? moodWord(mood) : "–"}</div></div>`;
}
function heroPolaroid(face, caption) {
  return `<div class="polaroid hero-pol"><span class="tape" aria-hidden="true"></span><div class="ph">${charHTML(face)}</div><div class="cap">${esc(caption)}</div></div>`;
}
function storyDayHTML(key, date, full) {
  const bits = scoreBits(key);
  return `<div class="story-day">
    ${dayPolaroid(key)}
    <div class="story-body">
      <div class="story-date">${date}</div>
      ${bits.length ? `<span class="story-scores">${bits.join(" · ")}</span>` : ""}
      ${storyLines(key, full).map(([label, text]) =>
        `<div class="story-line"><span class="story-label">${label}</span><span class="story-text">${esc(text)}</span></div>`).join("")}
    </div>
  </div>`;
}

const JOURNAL_PAGE = 14;
function journalKeys() {
  return Object.keys(state.days).filter(k => {
    const d = state.days[k];
    return hasText(d?.morning?.intention) || hasText(d?.evening?.happened) || hasText(d?.evening?.honest) || hasText(d?.evening?.spent);
  }).sort().reverse();
}
function journalDate(key) {
  const opts = { weekday: "short", day: "numeric", month: "short" };
  if (key.slice(0, 4) !== todayKey().slice(0, 4)) opts.year = "numeric";
  return parseKey(key).toLocaleDateString("en-GB", opts);
}
function journalSheetHTML() {
  const keys = journalKeys();
  const shown = keys.slice(0, sheet.limit);
  return `
    <div class="sheet-hero" style="background:var(--note-soft)">
      ${keys.length ? heroPolaroid("flustered", "don't read this") : heroPolaroid("away", "nothing yet")}
      <h2>Journal</h2>
      <div class="card-sub">${keys.length ? `${keys.length} ${keys.length === 1 ? "day" : "days"} in your own words` : "Nothing written yet"}</div>
    </div>
    ${shown.length ? shown.map((k, i) => {
      // a handwritten month heading whenever the month changes
      const month = k.slice(0, 7) !== (shown[i - 1] || "").slice(0, 7)
        ? `<div class="jmonth">${parseKey(k).toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</div>` : "";
      return `${month}<section class="card">${storyDayHTML(k, journalDate(k), false)}</section>`;
    }).join("")
      : `<section class="card"><div class="empty-note" style="margin-top:0">Intentions, “what happened” and “one honest thing” show up here once you've written a few.</div></section>`}
    ${keys.length > shown.length ? `<button class="btn-ghost" id="journal-more">Show more</button>` : ""}
  `;
}
function wireJournalSheet() {
  const more = sheetRoot.querySelector("#journal-more");
  if (more) more.onclick = () => { sheet.limit += JOURNAL_PAGE; renderSheet(); };
}

// sheet.offset: 0 = this week, -1 = last week, …
function storyWeek() {
  const start = addDays(weekStart(todayKey()), 7 * sheet.offset);
  const today = todayKey();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const k = addDays(start, i);
    if (k > today) break;
    days.push({ key: k, has: scoreBits(k).length > 0 || storyLines(k, true).length > 0 });
  }
  return { start, end: addDays(start, 6), days };
}
function weekSheetHTML() {
  const { start, end, days } = storyWeek();
  const written = days.filter(d => d.has);
  const moods = written.map(d => collectDay(d.key).mood).filter(v => v !== null);
  const face = moods.length ? exprFor(Math.round(avg(moods))) : written.length ? "thinking" : "away";
  const range = `${shortDate(start, true)} – ${shortDate(end, true)}`;
  return `
    <div class="sheet-hero" style="background:var(--note-soft)">
      ${heroPolaroid(face, moods.length ? moodWord(Math.round(avg(moods))) : written.length ? "hmm" : "nothing yet")}
      <h2>${sheet.offset === 0 ? "This week's story" : sheet.offset === -1 ? "Last week's story" : "Week in review"}</h2>
      <div class="week-nav">
        <button data-week="-1" aria-label="previous week">‹</button>
        <span class="card-sub">${range}</span>
        <button data-week="1" aria-label="next week" ${sheet.offset >= 0 ? "disabled" : ""}>›</button>
      </div>
    </div>
    <section class="card">
      ${written.length ? days.map(d => d.has
        ? storyDayHTML(d.key, prettyDate(d.key), true)
        : `<div class="story-day story-gap"><div class="story-head"><span class="story-date">${prettyDate(d.key)}</span><span class="muted">—</span></div></div>`
      ).join("") : `<div class="empty-note" style="margin-top:0">Nothing written this week${sheet.offset === 0 ? " yet" : ""}.</div>`}
    </section>
    ${written.length ? `<button class="btn-ghost" id="copy-week">Copy week as markdown</button>` : ""}
  `;
}
function weekMarkdown() {
  const { start, end, days } = storyWeek();
  const long = k => parseKey(k).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }).toLowerCase();
  const lines = [`# week of ${long(start)}`, ""];
  for (const d of days.filter(x => x.has)) {
    lines.push(`## ${prettyDate(d.key).toLowerCase()}`);
    const bits = scoreBits(d.key);
    if (bits.length) lines.push(`- ${bits.join(" · ")}`);
    for (const [label, text] of storyLines(d.key, true)) lines.push(`- ${label}: ${text}`);
    lines.push("");
  }
  const logged = state.log.filter(e => e.date >= start && e.date <= end).sort((a, b) => a.date.localeCompare(b.date));
  if (logged.length) {
    lines.push("## goals");
    for (const e of logged) {
      const g = state.goals.find(x => x.id === e.goal);
      lines.push(`- ${g ? g.title.toLowerCase() : "goal"}: ${e.text}${e.tag ? ` (${e.tag})` : ""}`);
    }
  }
  return lines.join("\n").trim() + "\n";
}
function wireWeekSheet() {
  sheetRoot.querySelectorAll("[data-week]").forEach(b => b.onclick = () => {
    sheet.offset = Math.min(0, sheet.offset + Number(b.dataset.week));
    renderSheet();
    sheetRoot.querySelector(".sheet").scrollTop = 0;
  });
  const copy = sheetRoot.querySelector("#copy-week");
  if (copy) copy.onclick = () => copyText(weekMarkdown(), "Week copied");
}

// ---------- progress tab ----------
// n days ending `shift` days ago
function collectWindow(n, shift = 0) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(collectDay(todayKey(-i - shift)));
  return out;
}
// one day's numbers, evening first
function collectDay(key) {
  const d = state.days[key];
  const m = d?.morning, ev = d?.evening;
  return {
    key,
    sleep: m?.sleep ?? null,
    mood: ev?.mood ?? m?.mood ?? null,
    body: ev?.body ?? m?.body ?? null,
    boundaries: ev?.boundaries ?? null
  };
}
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const fmt1 = x => x === null ? "–" : (Math.round(x * 10) / 10).toFixed(1);
const fieldAvg = (days, f) => avg(days.map(d => d[f]).filter(v => v !== null));

function chartSVG(days) {
  const W = 640, H = 240, padL = 30, padR = 12, padT = 14, padB = 30;
  const x = i => padL + (days.length === 1 ? 0 : i * (W - padL - padR) / (days.length - 1));
  const y = v => padT + (10 - v) * (H - padT - padB) / 9; // 1..10
  const series = [["sleep", "var(--lav)"], ["mood", "var(--pink)"], ["body", "var(--mint)"]];
  let g = "";
  for (const gy of [1, 4, 7, 10]) {
    g += `<line x1="${padL}" y1="${y(gy)}" x2="${W - padR}" y2="${y(gy)}" stroke="var(--line)" stroke-width="1.5"/>`;
    g += `<text x="${padL - 10}" y="${y(gy) + 4}" fill="var(--muted)" font-size="13" font-weight="600" text-anchor="end">${gy}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(days.length / 7));
  days.forEach((d, i) => {
    if (i % labelEvery === 0 || i === days.length - 1) {
      const [, m, dd] = d.key.split("-");
      g += `<text x="${x(i)}" y="${H - 8}" fill="var(--muted)" font-size="13" font-weight="600" text-anchor="middle">${Number(dd)}.${m}</text>`;
    }
  });
  for (const [field, color] of series) {
    let path = "", prev = false;
    days.forEach((d, i) => {
      const v = d[field];
      if (v === null) { prev = false; return; }
      path += (prev ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
      prev = true;
      g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" fill="${color}" stroke="var(--card)" stroke-width="2"/>`;
    });
    if (path) g = `<path d="${path.trim()}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` + g;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="sleep, mood and body over time" style="font-family:var(--font)">${g}</svg>`;
}

// once per day: the first look at Progress after checking in stamps the day
const STAMP_KEY = "daily-checkin-stamped";
function stampSlam() {
  if (!dayFilled(todayKey()) || reducedMotion()) return false;
  try {
    if (localStorage.getItem(STAMP_KEY) === todayKey()) return false;
    localStorage.setItem(STAMP_KEY, todayKey());
  } catch (e) { return false; }
  setTimeout(tick, 420);
  return true;
}

function renderProgress() {
  const days = collectWindow(range);
  const prevDays = collectWindow(range, range);
  const hasData = days.some(d => d.sleep !== null || d.mood !== null || d.body !== null);
  const checkedIn = days.filter(d => dayFilled(d.key)).length;
  const cur = currentStreak(), best = bestStreak();
  const journalCount = journalKeys().length;

  // last 7 days, sliding
  let last7 = "", n7 = 0;
  for (let i = 6; i >= 0; i--) {
    const k = todayKey(-i);
    const done = dayFilled(k);
    if (done) n7++;
    const letter = parseKey(k).toLocaleDateString("en-GB", { weekday: "narrow" });
    last7 += `<div class="wd ${i === 0 ? "today" : ""}"><span>${letter}</span><div class="circle ${done ? "done" : ""}">${done ? CHECK : ""}</div></div>`;
  }

  // boundary hold rates
  let heldAll = 0, totalAll = 0;
  const holdRate = name => {
    let held = 0, total = 0;
    for (const d of days) {
      const s = d.boundaries?.[name];
      if (s === "held") { held++; total++; }
      else if (s === "slipped") total++;
    }
    return total ? Math.round(100 * held / total) : null;
  };
  for (const d of days) for (const s of Object.values(d.boundaries || {})) {
    if (s === "held") { heldAll++; totalAll++; } else if (s === "slipped") totalAll++;
  }
  const bstats = state.boundaries.map(name => ({ name, pct: holdRate(name) }));
  // boundaries that show up in this window's records but aren't tracked anymore
  const currentBoundaries = new Set(state.boundaries);
  const pastNames = new Set();
  for (const d of days) for (const name of Object.keys(d.boundaries || {})) if (!currentBoundaries.has(name)) pastNames.add(name);
  const pastStats = [...pastNames].map(name => ({ name, pct: holdRate(name) })).filter(b => b.pct !== null);

  // mood x sleep split
  const paired = days.filter(d => d.sleep !== null && d.mood !== null);
  let hi = null, lo = null;
  if (paired.length >= 2) {
    const sMean = avg(paired.map(d => d.sleep));
    const hiDays = paired.filter(d => d.sleep >= sMean);
    const loDays = paired.filter(d => d.sleep < sMean);
    if (hiDays.length && loDays.length) {
      hi = avg(hiDays.map(d => d.mood));
      lo = avg(loDays.map(d => d.mood));
    }
  }

  const avgTile = (label, f, tint) => {
    const a = fieldAvg(days, f), p = fieldAvg(prevDays, f);
    let delta = "";
    if (a !== null && p !== null) {
      const d = Math.round((a - p) * 10) / 10;
      if (d > 0) delta = `<span class="delta up">↑ ${d.toFixed(1)}</span>`;
      else if (d < 0) delta = `<span class="delta down">↓ ${Math.abs(d).toFixed(1)}</span>`;
    }
    return `<div class="tile ${tint}"><b>${fmt1(a)}${delta}</b><span>${label}</span></div>`;
  };

  const bar = (name, pct, cls = "", faded = false, shown) => `<div class="bar-row" ${faded ? `style="opacity:0.5"` : ""}>
    <span class="name">${esc(cap(name))}</span>
    <span class="bar-track"><span class="bar-fill ${cls}" style="width:0" data-w="${pct ?? 0}"></span></span>
    <span class="pct">${shown ?? (pct === null ? "–" : pct + "%")}</span>
  </div>`;

  view.innerHTML = `
    <header class="top">
      <div><div class="date">How it's going</div><h1>Progress</h1></div>
    </header>
    <div class="hero ${dayFilled(todayKey()) ? "lit" : ""} ${stampSlam() ? "slam" : ""}" role="img" aria-label="${cur} ${cur === 1 ? "day" : "days"} in a row">
      ${stampSVG(cur)}
      <div class="big-label">in a row</div>
      <p>${dayFilled(todayKey()) ? "Today's in. " : "Check in today to keep it growing. "}Your record is ${best}.</p>
    </div>
    <div class="read-links">
      <button class="read-link" id="open-week"><b>This week's story</b><span>Read it like a diary</span></button>
      <button class="read-link" id="open-journal"><b>Journal</b><span>${journalCount ? `${journalCount} ${journalCount === 1 ? "day" : "days"} written` : "Past entries"}</span></button>
    </div>
    <section class="card">
      <div class="card-head"><span class="card-title">Last 7 days</span><span class="card-sub">${n7} of 7</span></div>
      <div class="week">${last7}</div>
    </section>
    <div class="chips" style="margin-top:20px">
      ${[7, 14, 30].map(n => `<button class="chip ${range === n ? "on" : ""}" data-range="${n}">${n} days</button>`).join("")}
    </div>
    <div class="stats">
      <div class="stat"><b>${checkedIn}<span class="muted" style="font-size:0.9rem">/${range}</span></b><span>days checked in</span></div>
      <div class="stat"><b>${best}</b><span>longest streak</span></div>
      <div class="stat"><b>${state.log.filter(e => days[0].key <= e.date).length}</b><span>adventures logged</span></div>
      <div class="stat"><b>${totalAll ? Math.round(100 * heldAll / totalAll) + "%" : "–"}</b><span>boundaries held</span></div>
    </div>
    <section class="card">
      <div class="card-head"><span class="card-title">Averages</span><span class="card-sub">vs the ${range} days before</span></div>
      <div class="summary">
        ${avgTile("Sleep", "sleep", "t-round")}
        ${avgTile("Body", "body", "t-square")}
        ${avgTile("Mood", "mood", "t-flower")}
      </div>
      ${hasData ? `<div style="margin-top:14px">${chartSVG(days)}</div>
        <div class="chart-legend"><span><i style="background:var(--lav)"></i>Sleep</span><span><i style="background:var(--mint)"></i>Body</span><span><i style="background:var(--pink)"></i>Mood</span></div>`
      : `<div class="empty-note">Your chart appears after a few check-ins.</div>`}
    </section>
    <section class="card">
      <div class="card-head"><span class="card-title">Boundaries</span></div>
      ${bstats.map(b => bar(b.name, b.pct)).join("")}
      ${pastStats.map(b => bar(b.name, b.pct, "", true)).join("")}
    </section>
    <section class="card">
      <div class="card-head"><span class="card-title">Mood after sleep</span></div>
      ${hi !== null
        ? bar("After better sleep", Math.round(hi * 10), "pink", false, fmt1(hi)) +
          bar("After worse sleep", Math.round(lo * 10), "pink-lo", false, fmt1(lo))
        : `<div class="empty-note">Needs a few days with both sleep and mood logged.</div>`}
    </section>
    <button class="btn-ghost" id="export-json" style="margin-top:22px">Export data (JSON)</button>
    <button class="btn-ghost" id="import-json">Import data</button>
    <input type="file" id="import-file" accept="application/json" hidden>
  `;
  view.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { range = Number(b.dataset.range); renderProgress(); });
  view.querySelector("#open-week").onclick = () => openSheet({ type: "week", offset: 0 });
  view.querySelector("#open-journal").onclick = () => openSheet({ type: "journal", limit: JOURNAL_PAGE });
  view.querySelector("#export-json").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `daily-checkin-${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const fileInput = view.querySelector("#import-file");
  view.querySelector("#import-json").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    f.text().then(text => {
      const raw = JSON.parse(text);
      const normalized = normalizeImportedState(raw);
      if (!normalized) throw new Error("bad file");
      if (!confirm("Import this file? This replaces all current check-ins and goals on this device.")) return;
      state = normalized;
      save();
      editingBoundaries = false;
      renderProgress();
      updateNavDots();
      toast("Imported");
    }).catch(() => toast("Couldn't read that file"))
      .finally(() => { fileInput.value = ""; });
  };
  animateProgress();
}

// draw the chart lines in and grow the bars once the view is on screen
function animateProgress() {
  if (reducedMotion()) {
    view.querySelectorAll(".bar-fill[data-w]").forEach(f => { f.style.width = f.dataset.w + "%"; });
    return;
  }
  const paths = view.querySelectorAll("svg.chart path");
  paths.forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    paths.forEach(p => {
      p.style.transition = "stroke-dashoffset 1s ease";
      p.style.strokeDashoffset = "0";
    });
    view.querySelectorAll(".bar-fill[data-w]").forEach(f => { f.style.width = f.dataset.w + "%"; });
  }));
}

// ---------- shell ----------
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  // longer lines stay up long enough to read
  toast._t = setTimeout(() => t.classList.remove("show"), Math.max(2200, msg.length * 55));
}

function pulse(btn) {
  btn.classList.remove("pulse");
  void btn.offsetWidth;
  btn.classList.add("pulse");
}

function confetti() {
  if (reducedMotion()) return;
  const colors = ["var(--peach)", "var(--pink)", "var(--lav)", "var(--mint)", "var(--blue)"];
  const cx = innerWidth / 2, cy = innerHeight * 0.45;
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    const a = Math.random() * Math.PI * 2, r = 90 + Math.random() * 130;
    c.style.left = cx + "px";
    c.style.top = cy + "px";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", `${Math.cos(a) * r}px`);
    c.style.setProperty("--dy", `${Math.sin(a) * r + 60}px`);
    if (i % 3 === 0) c.style.borderRadius = "50%";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1100);
  }
}

const renderers = { morning: renderMorning, evening: renderEvening, goals: renderGoals, progress: renderProgress };
// re-render the current tab in place (keeps scroll position)
function rerenderTab() {
  const y = scrollY;
  renderers[tab]();
  scrollTo(0, y);
}
function setTab(name) {
  tab = name;
  document.querySelectorAll("nav button").forEach(b => {
    const active = b.dataset.tab === name;
    b.classList.toggle("on", active);
    if (active) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  updateNavDots();
  renderers[name]();
  restart(view, "enter");
  // only the first render of a tab deals the cards in; later re-renders stay still
  clearTimeout(setTab._t);
  setTab._t = setTimeout(() => view.classList.remove("enter"), 800);
  window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

// default tab: evening after 17:00 — and in the small hours it's still last night,
// so open the evening tab already pointed at yesterday
const hour = new Date().getHours();
if (hour < 5) {
  eveningOffset = -1;
  setTab("evening");
} else {
  setTab(hour >= 17 ? "evening" : "morning");
}

// warm up every face once the first screen is drawn, so swapping is instant
const facePreload = [];
setTimeout(() => CHAR_FACES.forEach(n => { const i = new Image(); i.src = `chars/${n}.webp`; facePreload.push(i); }), 300);

const isSecureHost = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
if ("serviceWorker" in navigator && isSecureHost) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
